<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Comunidad de Vecinos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #667eea; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        h1 { color: #333; margin-bottom: 10px; text-align: center; }
        .subtitle { text-align: center; color: #999; font-size: 12px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; color: #333; font-weight: bold; }
        input[type="password"], input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #5568d3; }
        .error { color: #dc3545; font-size: 12px; margin-top: 10px; display: none; }
        .hidden { display: none !important; }
        .app { padding: 20px; }
        .nav { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav button { flex: 1; min-width: 100px; padding: 8px; font-size: 13px; background: #667eea; }
        .section { display: none; }
        .section.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f5f5f5; font-weight: bold; }
        .stat { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .logout { background: #dc3545 !important; }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="loginScreen" class="container">
        <h1>🏢 Gestión Comunidad</h1>
        <p class="subtitle">Sistema de información y administración</p>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="passwordInput" placeholder="Ingresa tu contraseña">
            <div class="error" id="loginError"></div>
        </div>
        <button onclick="app.login()">🔓 Acceder</button>
    </div>

    <!-- APP -->
    <div id="appScreen" class="container hidden">
        <h1>🏢 Gestión Comunidad</h1>
        
        <div class="nav">
            <button onclick="app.showSection('dashboard')">Dashboard</button>
            <button onclick="app.showSection('vecinos')">Vecinos</button>
            <button onclick="app.showSection('config')">Configuración</button>
            <button class="logout" onclick="app.logout()">Salir</button>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard" class="section active">
            <h2>Dashboard</h2>
            <div class="stat">👥 Vecinos: <strong id="totalVecinos">0</strong></div>
            <div class="stat">📋 Total datos guardados</div>
        </div>

        <!-- VECINOS -->
        <div id="vecinos" class="section">
            <h2>Vecinos</h2>
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" id="vecinoNombre" placeholder="Nombre del vecino">
            </div>
            <div class="form-group">
                <label>Piso</label>
                <input type="text" id="vecinoPiso" placeholder="Número de piso">
            </div>
            <button onclick="app.addVecino()">Agregar Vecino</button>
            <table>
                <thead><tr><th>Nombre</th><th>Piso</th><th>Acciones</th></tr></thead>
                <tbody id="vecinosList"></tbody>
            </table>
        </div>

        <!-- CONFIGURACIÓN -->
        <div id="config" class="section">
            <h2>Configuración</h2>
            <div class="form-group">
                <label>Nueva Contraseña</label>
                <input type="password" id="newPassword" placeholder="Dejar en blanco para no cambiar">
            </div>
            <div class="form-group">
                <label>Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" placeholder="Confirma">
            </div>
            <button onclick="app.saveConfig()">Guardar</button>
            <button onclick="app.exportData()" style="background: #17a2b8; margin-top: 10px;">Descargar Backup</button>
        </div>
    </div>

    <script>
        const app = {
            data: {
                password: null,
                nombre: 'Comunidad de Vecinos',
                vecinos: []
            },
            
            init() {
                this.loadData();
            },
            
            loadData() {
                const stored = localStorage.getItem('comunidadData');
                if (stored) {
                    try {
                        this.data = JSON.parse(stored);
                    } catch(e) {
                        console.log('Error loading');
                    }
                }
            },
            
            saveData() {
                localStorage.setItem('comunidadData', JSON.stringify(this.data));
            },
            
            login() {
                const entrada = document.getElementById('passwordInput').value.trim();
                const errorDiv = document.getElementById('loginError');
                errorDiv.classList.add('hidden');
                
                if (!entrada) {
                    errorDiv.textContent = '❌ Ingresa una contraseña';
                    errorDiv.classList.remove('hidden');
                    return;
                }
                
                // Primera vez
                if (!this.data.password) {
                    this.data.password = btoa(entrada);
                    this.saveData();
                    this.loginExitoso();
                    return;
                }
                
                // Verificar
                if (btoa(entrada) === this.data.password) {
                    this.loginExitoso();
                    return;
                }
                
                errorDiv.textContent = '❌ Contraseña incorrecta';
                errorDiv.classList.remove('hidden');
            },
            
            loginExitoso() {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appScreen').classList.remove('hidden');
                document.getElementById('passwordInput').value = '';
                this.updateDashboard();
            },
            
            logout() {
                if (confirm('¿Salir?')) {
                    document.getElementById('appScreen').classList.add('hidden');
                    document.getElementById('loginScreen').classList.remove('hidden');
                }
            },
            
            showSection(name) {
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                document.getElementById(name).classList.add('active');
                if (name === 'vecinos') this.renderVecinos();
                if (name === 'dashboard') this.updateDashboard();
            },
            
            updateDashboard() {
                document.getElementById('totalVecinos').textContent = this.data.vecinos.length;
            },
            
            addVecino() {
                const nombre = document.getElementById('vecinoNombre').value.trim();
                const piso = document.getElementById('vecinoPiso').value.trim();
                
                if (!nombre || !piso) {
                    alert('Completa todos los campos');
                    return;
                }
                
                this.data.vecinos.push({
                    id: Date.now(),
                    nombre: nombre,
                    piso: piso
                });
                
                this.saveData();
                document.getElementById('vecinoNombre').value = '';
                document.getElementById('vecinoPiso').value = '';
                this.renderVecinos();
            },
            
            renderVecinos() {
                const list = document.getElementById('vecinosList');
                list.innerHTML = this.data.vecinos.map(v => `
                    <tr>
                        <td>${v.nombre}</td>
                        <td>${v.piso}</td>
                        <td><button onclick="app.deleteVecino(${v.id})" style="padding: 4px 8px; background: #dc3545; font-size: 12px;">Eliminar</button></td>
                    </tr>
                `).join('');
            },
            
            deleteVecino(id) {
                if (confirm('¿Eliminar?')) {
                    this.data.vecinos = this.data.vecinos.filter(v => v.id !== id);
                    this.saveData();
                    this.renderVecinos();
                }
            },
            
            saveConfig() {
                const pwd = document.getElementById('newPassword').value;
                const pwd2 = document.getElementById('confirmPassword').value;
                
                if (!pwd) {
                    alert('Ingresa una contraseña');
                    return;
                }
                
                if (pwd !== pwd2) {
                    alert('Las contraseñas no coinciden');
                    return;
                }
                
                this.data.password = btoa(pwd);
                this.saveData();
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
                alert('✓ Contraseña guardada');
            },
            
            exportData() {
                const json = JSON.stringify(this.data, null, 2);
                const blob = new Blob([json], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'backup-' + new Date().toISOString().split('T')[0] + '.json';
                a.click();
            }
        };
        
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
        
        document.getElementById('passwordInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') app.login();
        });
    </script>
</body>
</html>
